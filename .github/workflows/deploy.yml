name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build Site"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: public-build
          path: public/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        # Prevents the "Are you sure you want to continue connecting?" interactive prompt
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          # Flags:
          # -a: archive mode (preserves permissions/times)
          # -v: verbose
          # -z: compress during transfer
          # --delete: remove files on server that were deleted locally
          # public/: trailing slash is CRITICAL. It means "contents of public", not "the folder public"

          rsync -avz --delete ./public/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/wiki/
